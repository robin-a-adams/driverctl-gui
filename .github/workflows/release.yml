name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends devscripts debhelper lintian
          sudo apt-get build-dep -y ./
      - name: Build package
        run: dpkg-buildpackage -us -uc -b
      - name: Run lintian
        run: lintian ../*.changes || true
      - name: Collect artifacts
        run: |
          mkdir dist
          cp ../*.deb dist/
      - name: Publish release
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
